ShortDescription: Lightweight, modern Internet Speed Desktop Widget for Windows 10
Description: |
  NetSpeedWidget is a modern, lightweight floating desktop widget for Windows 10 that continuously
  displays real-time network throughput (download and upload), ping latency, Wi-Fi signal strength,
  and connection status. Features a real-time sparkline graph, animated speed indicators, customizable
  themes and scales, edge snapping, always-on-top, system tray integration, and an integrated ISP speed test tool.
